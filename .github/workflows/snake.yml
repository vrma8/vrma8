name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at midnight UTC
  workflow_dispatch:        # Allow manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch snake animation speed
        run: |
          # SVG uses: animation:none <duration>ms linear infinite
          # Increase ms = slower snake | Decrease ms = faster snake
          # Default generated by snk is ~20500ms. We set 60000ms (60s = very slow crawl)
          sed -i 's/animation:none [0-9]*ms/animation:none 60000ms/g' dist/github-snake.svg
          sed -i 's/animation:none [0-9]*ms/animation:none 60000ms/g' dist/github-snake-dark.svg

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
