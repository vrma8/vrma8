<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Mount Fuji - Interactive Animated Artwork</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Cyberpunk & Japanese aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Noto+Sans+JP:wght@300;700;900&family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff2a8d;
            --neon-purple: #b026ff;
            --neon-cyan: #00f3ff;
            --cyber-dark: #07020d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--cyber-dark);
            font-family: 'Orbitron', sans-serif;
            user-select: none;
        }

        /* Continuous Keyframe Animations */
        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes neonPulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px var(--neon-purple)) drop-shadow(0 0 25px var(--neon-pink));
                opacity: 0.95;
            }
            50% {
                filter: drop-shadow(0 0 20px var(--neon-purple)) drop-shadow(0 0 45px var(--neon-pink)) drop-shadow(0 0 70px #e040fb);
                opacity: 1;
            }
        }

        @keyframes gateGlow {
            0%, 100% {
                stroke: #d8b4fe;
                filter: drop-shadow(0 0 4px #c084fc) drop-shadow(0 0 12px #9333ea);
            }
            50% {
                stroke: #f472b6;
                filter: drop-shadow(0 0 8px #f43f5e) drop-shadow(0 0 20px #e11d48);
            }
        }

        @keyframes hudPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Apply Neon Classes */
        .welcome-text-glow {
            animation: neonPulse 3.5s ease-in-out infinite;
            font-family: 'Kaushan Script', cursive;
        }

        .torii-neon {
            animation: gateGlow 4s ease-in-out infinite;
        }

        .hud-rotate-cw {
            transform-origin: center;
            animation: rotateClockwise 18s linear infinite;
        }

        .hud-rotate-ccw {
            transform-origin: center;
            animation: rotateCounterClockwise 12s linear infinite;
        }

        .hud-pulse-ring {
            transform-origin: center;
            animation: hudPulse 2s ease-in-out infinite;
        }

        /* Dark Vignette Overlay for smooth border fade out */
        .vignette-overlay {
            pointer-events: none;
            background: radial-gradient(
                circle at 50% 50%, 
                rgba(7, 2, 13, 0) 40%, 
                rgba(7, 2, 13, 0.5) 70%, 
                rgba(7, 2, 13, 0.95) 90%, 
                rgba(3, 0, 7, 1) 100%
            );
        }

        /* Scanline Overlay for Cyberpunk feel */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Glassmorphism UI Controls */
        .glass-panel {
            background: rgba(15, 7, 32, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(192, 132, 252, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(168, 85, 247, 0.15);
        }
    </style>
</head>
<body class="bg-black text-purple-100 flex flex-col justify-center items-center h-screen w-screen overflow-hidden relative">

    <!-- Main Render Canvas Stack -->
    <div id="artwork-wrapper" class="relative w-full h-full flex items-center justify-center overflow-hidden">
        
        <!-- Canvas Layer 1: Stars, Nebulae, and Dynamic Petals Particle System -->
        <canvas id="petal-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></canvas>

        <!-- SVG Vector Master Artwork Layer -->
        <svg id="fuji-svg" class="absolute inset-0 w-full h-full z-0" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Sky Synthwave Gradient -->
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0d021a" />
                    <stop offset="40%" stop-color="#24073d" />
                    <stop offset="70%" stop-color="#4c126b" />
                    <stop offset="88%" stop-color="#801882" />
                    <stop offset="100%" stop-color="#21032a" />
                </linearGradient>

                <!-- Fuji Snow Gradient -->
                <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="40%" stop-color="#f0abfc" />
                    <stop offset="80%" stop-color="#a855f7" />
                    <stop offset="100%" stop-color="#3b0764" />
                </linearGradient>

                <!-- Fuji Mountain Shadow Gradient -->
                <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3b0764" />
                    <stop offset="40%" stop-color="#1e053a" />
                    <stop offset="100%" stop-color="#0a0114" />
                </linearGradient>

                <!-- Lake Glow Gradient -->
                <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8" />
                    <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#0f031e" stop-opacity="0.9" />
                </linearGradient>

                <!-- Neon Glow Filters -->
                <filter id="ultraGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6" result="blur1" />
                    <feGaussianBlur stdDeviation="18" result="blur2" />
                    <feGaussianBlur stdDeviation="35" result="blur3" />
                    <feMerge>
                        <feMergeNode in="blur3" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="8" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="gatePulseFilter">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Background Sky -->
            <rect width="1920" height="1080" fill="url(#skyGrad)" />

            <!-- Moon with Soft Glow -->
            <g transform="translate(480, 180)">

                <circle cx="20" cy="-12" r="50" fill="#24073d" />
            </g>

            <path d="M 0,730 Q 450,650 900,710 T 1800,680 L 1920,700 L 1920,1080 L 0,1080 Z" fill="#0f021e" opacity="0.9" />

            <!-- Reflective Lake / Valley Mist -->

            <ellipse cx="880" cy="780" rx="450" ry="18" fill="url(#lakeGrad)" opacity="0.6" />

            <!-- MOUNT FUJI (Central Feature) -->

                <!-- Fuji Base & Body Silhouette -->

                <!-- Snow Ridges & Highlights -->

                <!-- Ambient Mountain Crest Glow -->

                <!-- Right Pine Group -->

                <polygon points="1680,810 1655,870 1705,870" />
                <polygon points="1760,790 1730,860 1790,860" />

            </g>

            <!-- UPPER-LEFT SAKURA (CHERRY BLOSSOM) BRANCH -->

                <!-- Main Dark Silhouette Branch -->
                <path d="M -20,-20 Q 120,80 240,60 T 380,180 T 480,240" fill="none" stroke="#090212" stroke-width="18" stroke-linecap="round" />

                <!-- Sakura Blossoms with Neon Glow Highlights -->

            <!-- RIGHT SIDE TORII GATE & NEON ELEMENTS -->
            <g id="torii-gate-group" transform="translate(1620, 420)">
                <!-- Dark Torii Structure Silhouette -->

                <!-- Top Crossbeams (Kasagi & Nuki) -->
                <path d="M 0,80 Q 140,65 282,80 L 275,115 Q 140,100 7,115 Z" fill="#08010f" />

                    <path d="M 5,83 Q 140,68 277,83" />

                    <path d="M 22,161 L 260,161" />

                    <!-- Pillar Neon Outlines -->
                    <line x1="42" y1="90" x2="42" y2="490" />

                <text x="0" y="75"

            <!-- CYBER COOL LOCK STYLE AIM HUD TARGETING MOUNT FUJI -->
            <g id="cyber-lock-hud" transform="translate(960, 420)">
                <!-- Laser Target Vector Lines from Sky/Horizons -->
                <line x1="-960" y1="0" x2="960" y2="0" stroke="#00f3ff" stroke-width="0.75" stroke-dasharray="8 4" opacity="0.35" />

                <circle cx="0" cy="0" r="120" fill="none" stroke="#f472b6" stroke-width="1.5" class="hud-pulse-ring" opacity="0.4" />
                <circle cx="0" cy="0" r="180" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4 8" class="hud-rotate-ccw" opacity="0.3" />

                <!-- Outer Rotating Segmented HUD Ring -->
                <g class="hud-rotate-cw">
                    <circle cx="0" cy="0" r="90" fill="none" stroke="#00f3ff" stroke-width="3" stroke-dasharray="40 20 10 20" filter="url(#softGlow)" />
                    <circle cx="0" cy="0" r="75" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="12 12" />
                </g>

                <!-- Inner Counter-Rotating HUD Ring -->
                <g class="hud-rotate-ccw">
                    <circle cx="0" cy="0" r="55" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="30 15 5 15" />
                    <!-- Ring Tick Marks -->
                    <line x1="-55" y1="0" x2="-45" y2="0" stroke="#00f3ff" stroke-width="3" />
                    <line x1="45" y1="0" x2="55" y2="0" stroke="#00f3ff" stroke-width="3" />
                    <line x1="0" y1="-55" x2="0" y2="-45" stroke="#00f3ff" stroke-width="3" />
                    <line x1="0" y1="45" x2="0" y2="55" stroke="#00f3ff" stroke-width="3" />

                <!-- Corner Lock Brackets [ ] -->

                    <path d="M -40,-25 L -40,-40 L -25,-40" />
                    <!-- Top-Right -->
                    <path d="M 25,-40 L 40,-40 L 40,-25" />
                    <!-- Bottom-Left -->
                    <path d="M -40,25 L -40,40 L -25,40" />
                    <!-- Bottom-Right -->
                    <path d="M 25,40 L 40,40 L 40,25" />

                <!-- Central Aim Diamond Lock -->
                <polygon points="0,-12 12,0 0,12 -12,0" fill="rgba(244, 114, 182, 0.25)" stroke="#f472b6" stroke-width="2" class="hud-pulse-ring" />
                <circle cx="0" cy="0" r="3" fill="#00f3ff" />

                <!-- Dynamic HUD Tactical Readout Data -->
                <g font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" fill="#00f3ff">
                    <!-- Top Status Readout -->
                    <text x="0" y="-105" text-anchor="middle" letter-spacing="3" fill="#f472b6" filter="url(#softGlow)">

                    <text x="-160" y="-10" text-anchor="end" letter-spacing="1">ELEV: 3,776M</text>
                    <text x="-160" y="8" text-anchor="end" letter-spacing="1" fill="#e879f9">LAT: 35.3606°N</text>
                    <!-- Right Status Readout -->

        <!-- Cinematic Border Vignette Overlay (Dark Faded Borders) -->

        <!-- Cyberpunk CRT Scanline Effect -->

        <!-- Floating Interactive Cyber Control Bar -->

            <!-- HUD Toggle Button -->
            <button id="btn-toggle-hud" class="px-4 py-2 rounded-lg bg-purple-900/60 hover:bg-purple-700/80 border border-purple-400/40 text-purple-200 hover:text-white font-bold transition flex items-center gap-2 shadow-lg shadow-purple-950">
                <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                HUD LOCK: <span id="hud-status-text" class="text-cyan-300">ON</span>
            </button>

            <!-- Petals Density Slider -->
            <div class="flex items-center gap-3 px-3 py-1 bg-black/40 rounded-lg border border-purple-500/20">

                <input type="range" id="petal-count-slider" min="15" max="120" value="55" class="w-24 accent-pink-500 cursor-pointer">

            <div class="flex items-center gap-3 px-3 py-1 bg-black/40 rounded-lg border border-purple-500/20">
                <label for="petal-speed-slider" class="text-purple-300 font-semibold">WIND:</label>
                <input type="range" id="petal-speed-slider" min="1" max="5" step="0.5" value="2" class="w-20 accent-purple-500 cursor-pointer">
                <span id="petal-speed-val" class="text-purple-400 font-mono w-6">2x</span>
            </div>

            <!-- Audio Lock Beep Toggle -->
            <button id="btn-audio-synth" class="px-3 py-2 rounded-lg bg-pink-950/50 hover:bg-pink-800/60 border border-pink-500/30 text-pink-300 font-bold transition">
                AUDIO HUM: <span id="audio-status-text" class="text-pink-400">OFF</span>
            </button>

            <!-- Reset Lock Target Button -->
            <button id="btn-recenter-hud" class="px-3 py-2 rounded-lg bg-cyan-950/50 hover:bg-cyan-800/60 border border-cyan-500/30 text-cyan-300 font-bold transition">
                AIM FUJI
            </button>
        </div>
    </div>

    <script>
        // Canvas & Context Setup
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Configuration State
        let petalCount = 55;
        let windSpeedFactor = 2;
        let isHudVisible = true;
        let isAudioEnabled = false;

        // Web Audio API Synthesizer for Cyber Hum & Lock Beeps
        let audioCtx = null;
        let humOscillator = null;
        let humGain = null;

        // Resize Listener
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        // Starfield Particles
        let stars = [];
        function initStars() {
            stars = [];
            const numStars = Math.floor((width * height) / 3000);
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.75, // Sky area
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    twinkleSpeed: 0.005 + Math.random() * 0.015
                });
            }
        }
        initStars();

        // Floating Pink Petal Particle Class
        class SakuraPetal {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = initial ? Math.random() * width : -40;
                this.y = Math.random() * height;
                this.size = 6 + Math.random() * 10;
                this.speedX = (1.2 + Math.random() * 2.2);
                this.speedY = (0.4 + Math.random() * 1.2);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                this.oscillationFrequency = 0.01 + Math.random() * 0.02;
                this.oscillationAmplitude = 1 + Math.random() * 2;
                this.step = Math.random() * 100;
                this.opacity = 0.4 + Math.random() * 0.5;
                
                // Varied Cyber Pink / Magenta Colors
                const colors = ['#f472b6', '#f0abfc', '#e879f9', '#ff2a8d', '#d946ef'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.glow = Math.random() > 0.4;
            }

            update() {
                this.step += this.oscillationFrequency;
                this.x += (this.speedX + Math.sin(this.step) * this.oscillationAmplitude) * (windSpeedFactor * 0.6);
                this.y += (this.speedY + Math.cos(this.step * 0.5) * 0.5) * (windSpeedFactor * 0.6);
                this.rotation += this.rotationSpeed;

                // Loop around screen boundaries seamlessly
                if (this.x > width + 50 || this.y > height + 50) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;

                if (this.glow) {
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                }

                ctx.fillStyle = this.color;
                
                // Draw Natural Organic Petal Geometry
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.bezierCurveTo(this.size, -this.size * 0.5, this.size * 0.8, this.size * 0.8, 0, this.size);
                ctx.bezierCurveTo(-this.size * 0.8, this.size * 0.8, -this.size, -this.size * 0.5, 0, -this.size);
                ctx.fill();

                ctx.restore();
            }
        }

        let petals = [];
        function syncPetalsCount() {
            while (petals.length < petalCount) {
                petals.push(new SakuraPetal());
            }
            while (petals.length > petalCount) {
                petals.pop();
            }
        }
        syncPetalsCount();

        // Main Render Loop (60 FPS)
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Render & Twinkle Stars
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
                ctx.fillStyle = `rgba(240, 171, 252, ${Math.max(0, star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 2. Render Floating Sakura Petals
            for (let i = 0; i < petals.length; i++) {
                petals[i].update();
                petals[i].draw();
            }

            requestAnimationFrame(animate);
        }

        // Start Animation Loop on Window Load
        window.onload = function() {
            animate();
        };

        // UI Control Event Listeners
        const hudGroup = document.getElementById('cyber-lock-hud');
        const btnToggleHud = document.getElementById('btn-toggle-hud');
        const hudStatusText = document.getElementById('hud-status-text');

        btnToggleHud.addEventListener('click', () => {
            isHudVisible = !isHudVisible;
            hudGroup.style.display = isHudVisible ? 'block' : 'none';
            hudStatusText.innerText = isHudVisible ? 'ON' : 'OFF';
            hudStatusText.className = isHudVisible ? 'text-cyan-300' : 'text-red-400';
            playBeepSound(isHudVisible ? 880 : 440);
        });

        // Petal Count Slider
        const petalSlider = document.getElementById('petal-count-slider');
        const petalValDisplay = document.getElementById('petal-count-val');
        petalSlider.addEventListener('input', (e) => {
            petalCount = parseInt(e.target.value);
            petalValDisplay.innerText = petalCount;
            syncPetalsCount();
        });

        // Wind Speed Slider
        const speedSlider = document.getElementById('petal-speed-slider');
        const speedValDisplay = document.getElementById('petal-speed-val');
        speedSlider.addEventListener('input', (e) => {
            windSpeedFactor = parseFloat(e.target.value);
            speedValDisplay.innerText = `${windSpeedFactor}x`;
        });

        // Interactive Aiming: Click on image to move Lock HUD target!
        const svgElement = document.getElementById('fuji-svg');
        const btnRecenter = document.getElementById('btn-recenter-hud');

        function moveHudTarget(svgX, svgY) {
            hudGroup.setAttribute('transform', `translate(${svgX}, ${svgY})`);
            playBeepSound(1200);
        }

        svgElement.addEventListener('click', (e) => {
            const rect = svgElement.getBoundingClientRect();
            const scaleX = 1920 / rect.width;
            const scaleY = 1080 / rect.height;
            const clickSvgX = (e.clientX - rect.left) * scaleX;
            const clickSvgY = (e.clientY - rect.top) * scaleY;
            
            if (isHudVisible) {
                moveHudTarget(clickSvgX, clickSvgY);
            }
        });

        btnRecenter.addEventListener('click', () => {
            // Lock back onto Mount Fuji Peak (960, 420)
            moveHudTarget(960, 420);
        });

        // Audio Synthesizer Functions
        const btnAudio = document.getElementById('btn-audio-synth');
        const audioStatusText = document.getElementById('audio-status-text');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeepSound(freq = 880) {
            if (!isAudioEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log('Audio playback prevented');
            }
        }

        btnAudio.addEventListener('click', () => {
            isAudioEnabled = !isAudioEnabled;
            audioStatusText.innerText = isAudioEnabled ? 'ON' : 'OFF';
            audioStatusText.className = isAudioEnabled ? 'text-cyan-300' : 'text-pink-400';
            if (isAudioEnabled) {
                playBeepSound(960);
            }
        });
    </script>
</body>
</html>
